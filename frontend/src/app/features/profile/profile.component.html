<div
  class="flex flex-col items-center h-full p-4 bg-light-bg-second dark:bg-dark-bg-second text-basic-text dark:text-dark-text shadow-inner-left-top"
>
  <h2 class="m-4 text-4xl font-bold">Yours Credentials</h2>
  <form
    [formGroup]="profileForm"
    class="max-w-lg w-full bg-light-bg dark:bg-dark-bg p-6 rounded-lg shadow-md"
  >
    <div class="mb-4">
      <label for="name" class="block font-semibold mb-2">Name:</label>
      <input
        id="name"
        formControlName="name"
        type="text"
        class="w-full p-2 border border-light-bg-second dark:border-dark-bg-second rounded focus:outline-none focus:ring-2 focus:ring-hover-bg bg-light-bg-second dark:bg-dark-bg-second"
      />
      <div
        *ngIf="formName?.invalid && formName?.touched"
        class="mt-1 text-sm text-red-500"
      >
        <small *ngIf="formName?.errors?.['required']">Name is required.</small>
        <small *ngIf="formName?.errors?.['minlength']"
          >Name must be at least 3 characters long.</small
        >
      </div>
    </div>
    <div class="mb-4">
      <label for="email" class="block font-semibold mb-2">Email:</label>
      <input
        id="email"
        formControlName="email"
        type="email"
        class="w-full p-2 border border-light-bg-second dark:border-dark-bg-second rounded focus:outline-none focus:ring-2 focus:ring-hover-bg bg-light-bg-second dark:bg-dark-bg-second"
      />
      <div
        *ngIf="formEmail?.invalid && formEmail?.touched"
        class="mt-1 text-sm text-red-500"
      >
        <small *ngIf="formEmail?.errors?.['required']"
          >Email is required.</small
        >
        <small *ngIf="formEmail?.errors?.['email']"
          >Please enter a valid email address.</small
        >
      </div>
    </div>
    <div class="mb-4">
      <label for="role" class="block font-semibold mb-2">Role:</label>
      <select
        id="role"
        formControlName="role"
        class="w-full p-2 border border-light-bg-second dark:border-dark-bg-second rounded focus:outline-none focus:ring-2 focus:ring-hover-bg bg-light-bg-second dark:bg-dark-bg-second"
      >
        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
      </select>
      <div
        *ngIf="formRole?.invalid && formRole?.touched"
        class="mt-1 text-sm text-red-500"
      >
        <small *ngIf="formRole?.errors?.['required']">Role is required.</small>
      </div>
    </div>
    <div class="flex justify-start items-center gap-4">
      <button
        appBounceOnClick
        type="submit"
        (click)="processEdit()"
        class="m-auto py-2 px-4 bg-hover-bg text-white rounded shadow-md hover:bg-accent-text transition disabled:opacity-50"
      >
        {{ submitLabel }}
      </button>
    </div>
  </form>
</div>
